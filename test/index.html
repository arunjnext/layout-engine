<!DOCTYPE html>
<html lang="en">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Engine - Smart Splitting Test</title>
  <link rel="stylesheet" href="./styles.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>Resume Layout Engine - Testing Playground</h1>
      <div class="controls">
        <button id="test-smart-split">Test Smart Split</button>
        <button id="test-whole-move">Test Whole Block Move</button>
        <button id="test-multiple">Test Multiple Positions</button>
        <button id="test-education">Test Education Split</button>
        <button id="test-small-fit">Test Small Entry (Fits)</button>
        <button id="test-two-columns">Test Two Columns (50/50)</button>
        <button id="test-custom-widths">Test Custom Widths (60/40)</button>

    <div class="test-info">
      <div id="info-panel">

        <div id="info-content">Click a test button to start</div>

    <div id="resume-container" class="resume-container"></div>

  <script type="module" src="./main.ts"></script>
