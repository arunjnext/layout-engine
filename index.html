<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Layout Engine - Redirecting...</title>
    <style>
      body {
        margin: 0;
        padding: 40px;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .redirect-message {
        max-width: 600px;
        background: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        text-align: center;
      }

      h1 {
        margin: 0 0 20px 0;
        color: #333;
      }

      p {
        margin: 0 0 20px 0;
        color: #666;
        line-height: 1.6;
      }

      .button {
        display: inline-block;
        padding: 12px 24px;
        background: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-weight: bold;
        transition: background 0.2s;
      }

      .button:hover {
        background: #0056b3;
      }

      .note {
        margin-top: 30px;
        padding: 15px;
        background: #fff3cd;
        border-left: 4px solid #ffc107;
        text-align: left;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="redirect-message">
      <h1>🚀 Project Restructured!</h1>
      <p>
        This project has been restructured into a proper <strong>headless library</strong>.
        The old demo has been moved to the examples folder.
      </p>
      <p>
        <a href="/examples/vanilla/" class="button">View Vanilla JS Example</a>
      </p>
      <div class="note">
        <strong>📚 Documentation:</strong><br>
        • <a href="/README.md">README</a><br>
        • <a href="/docs/API.md">API Reference</a><br>
        • <a href="/docs/EXAMPLES.md">Examples</a><br>
        • <a href="/MIGRATION.md">Migration Guide</a>
      </div>
    </div>

    <script>
      // Auto-redirect after 3 seconds
      setTimeout(() => {
        window.location.href = '/examples/vanilla/';
      }, 3000);
    </script>
  </body>
</html>
