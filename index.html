<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>page-spliter</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
      }
      
      #resume-container {
        max-width: 210mm;
        margin: 0 auto;
        background: white;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
      }
      
      #resume-content-area {
        min-height: 297mm;
        padding: 20mm;
        background: white;
      }
      
      #remaining-space-display {
        position: fixed;
        top: 10px;
        right: 10px;
        background: #333;
        color: white;
        padding: 10px 15px;
        border-radius: 5px;
        font-size: 14px;
        z-index: 1000;
      }
      
      .resume-position {
        margin-bottom: 20px;
      }
      
      .position-title-section {
        font-size: 16px;
        font-weight: bold;
        margin-bottom: 5px;
      }
      
      .position-intro {
        margin-top: 5px;
        margin-bottom: 10px;
        font-style: italic;
      }
      
      .position-statements {
        margin-top: 10px;
        padding-left: 20px;
      }
      
      .position-statement {
        margin-bottom: 5px;
      }
    </style>
  </head>
  <body>
    <div id="remaining-space-display">Remaining space: --</div>
    <div id="resume-container">
      <div id="resume-content-area"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
